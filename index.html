<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISITOR ACCESS | SANビル 受付</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f; 
            --text-sub: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        header { padding: 60px 20px 30px; text-align: center; }

        .lang-switch { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }

        .lang-btn {
            background: #f5f5f7; border: none; padding: 8px 16px; font-size: 12px;
            font-weight: 600; cursor: pointer; border-radius: 20px; color: var(--text-sub);
            transition: all 0.2s;
        }

        .lang-btn.active { background-color: var(--text-main); color: #fff; }

        /* 準備中画面のメインコンテナ */
        .maintenance-container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px 40px 120px; text-align: center;
        }

        .building-name {
            font-size: 14px; font-weight: 700; color: var(--text-sub);
            letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px;
        }

        .status-title {
            font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
            margin: 0 0 16px 0; line-height: 1.3;
        }

        .status-desc {
            font-size: 15px; color: var(--text-sub); max-width: 320px;
            margin: 0; line-height: 1.6; font-weight: 400;
        }
    </style>
</head>
<body>

<header>
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="ja" onclick="switchLang('ja')">日本語</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
        <button class="lang-btn" data-lang="zh" onclick="switchLang('zh')">中文</button>
    </div>
</header>

<div class="maintenance-container">
    <div class="building-name">SAN BLDG.</div>
    <h1 class="status-title" id="statusTitle">ただいま準備中です</h1>
    <p class="status-desc" id="statusDesc">新システム導入に伴い、現在データを整備しております。運用開始までしばらくお待ちください。</p>
</div>

<script>
    let currentLang = 'ja';
    
    // 3カ国語の文言定義
    const translations = {
        ja: {
            title: "ただいま準備中です",
            desc: "新システム導入に伴い、現在データを整備しております。運用開始までしばらくお待ちください。"
        },
        en: {
            title: "Under Construction",
            desc: "We are currently setting up the data for the new reception system. Thank you for your patience."
        },
        zh: {
            title: "系统正在准备中",
            desc: "伴随新系统的导入，目前正在整理入驻企业的数据。请稍等片刻，直至系统正式启用。"
        }
    };

    function switchLang(lang) {
        currentLang = lang;
        // ボタンの切り替え
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
        // テキストの切り替え
        document.getElementById('statusTitle').innerText = translations[lang].title;
        document.getElementById('statusDesc').innerText = translations[lang].desc;
    }
</script>
</body>
</html>
