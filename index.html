<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISITOR ACCESS</title>
    
    <meta http-equiv="refresh" content="0;URL=https://sanbuilding.pages.dev">

    <style>
        :root { --bg-color: #ffffff; --text-main: #1d1d1f; --text-sub: #86868b; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { padding: 60px 20px 30px; text-align: center; }
        .lang-switch { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .lang-btn { background: #f5f5f7; border: none; padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 20px; color: var(--text-sub); }
        .lang-btn.active { background-color: var(--text-main); color: #fff; }
        .maintenance-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 40px 120px; text-align: center; }
        .building-name { font-size: 14px; font-weight: 700; color: var(--text-sub); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
        .status-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 16px 0; line-height: 1.3; }
        .status-desc { font-size: 15px; color: var(--text-sub); max-width: 320px; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
<header>
    <div class="lang-switch">
        <button class="lang-btn active">日本語</button>
        <button class="lang-btn">English</button>
        <button class="lang-btn">中文</button>
    </div>
</header>
<div class="maintenance-container">
    <div class="building-name">SAN BLDG.</div>
    <h1 class="status-title">新サイトへ移動しています</h1>
    <p class="status-desc">自動的に新しい受付ページへ転送されます。移動しない場合はしばらくお待ちください。</p>
</div>
</body>
</html>
